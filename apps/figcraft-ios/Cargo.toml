[package]
name = "figcraft-ios"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# No `[lints] workspace = true` here on purpose: the iPad host needs `unsafe` for the Swift bridge.

[lib]
name = "figcraft_ios"
crate-type = ["staticlib"]

[dependencies]
figcraft-engine = { workspace = true }
figcraft-ui-egui = { workspace = true }
figcraft-text = { workspace = true }
egui = { workspace = true }
egui-wgpu = { version = "0.37", default-features = false }
wgpu = { version = "30", default-features = false, features = ["metal", "wgsl"] }
pollster = "1"
serde_json = { workspace = true }
log = { workspace = true }
